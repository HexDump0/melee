# Build the port and the launcher for Linux and Windows, and publish them.
#
# Triggered by a tag (`git tag v0.2.0 && git push --tags`) or by hand from the
# Actions tab.  The asset names are the contract in
# native/AI/reference/releases.md -- the launcher matches on them exactly, so
# renaming anything here breaks "Check for update" in every installed copy.
#
# **The port is 32-bit** (ADR-0012), on both platforms, which is why every job
# builds a 32-bit SDL3 from source: no distribution ships one.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  SDL_VERSION: "3.4.14"

jobs:
  # Cross-compiled from Linux, which is exactly how it was developed and
  # tested -- see native/AI/reference/windows.md.
  port-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      # g++ as well as gcc: the port is C, but SDL3's CMakeLists calls
      # enable_language(CXX), so configuring fails without a C++ cross
      # compiler even though nothing C++ is ever built.
      - name: MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 g++-mingw-w64-i686 \
            cmake ninja-build pkg-config

      - name: Cross-build SDL3
        run: |
          curl -sL -o sdl.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL3-${SDL_VERSION}.tar.gz"
          tar xzf sdl.tar.gz
          cat > mingw.cmake <<'EOF'
          set(CMAKE_SYSTEM_NAME Windows)
          set(CMAKE_SYSTEM_PROCESSOR x86)
          set(CMAKE_C_COMPILER i686-w64-mingw32-gcc)
          set(CMAKE_CXX_COMPILER i686-w64-mingw32-g++)
          set(CMAKE_RC_COMPILER i686-w64-mingw32-windres)
          set(CMAKE_FIND_ROOT_PATH /usr/i686-w64-mingw32)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          EOF
          cmake -S "SDL3-${SDL_VERSION}" -B sdlb -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$PWD/mingw.cmake -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$PWD/sdl3 \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build sdlb -j"$(nproc)"
          cmake --install sdlb

      # Static, so the release is one file: a user who downloads melee.exe and
      # nothing else still has a working game.
      - name: Build the port
        run: MELEE_WIN_LINK=static native/tools/windows_build.sh "$PWD/win" "$PWD/sdl3"

      - name: Name it for the release
        run: |
          mkdir -p out
          cp win/melee.exe out/melee-windows-x86.exe

      - uses: actions/upload-artifact@v4
        with: { name: port-windows, path: out/* }

  port-linux:
    runs-on: ubuntu-latest
    # Debian, not the Ubuntu runner, and that is the fix rather than a
    # preference.  **Ubuntu's i386 is a partial architecture** -- it carries
    # what Wine and 32-bit games need and little else -- so building anything
    # 32-bit there means discovering one missing `:i386` dev package per CI
    # run: first `libglib2.0-dev` (via PulseAudio), then Xcursor, then however
    # many more.  Debian keeps i386 complete, which ends the whole class.
    #
    # It also gives an older glibc than the runner's, so the released binary
    # runs on more distributions rather than fewer.
    container: debian:bookworm
    steps:
      # Before checkout: actions/checkout needs git in the container, and
      # without it the submodules the build depends on are silently skipped.
      - name: Toolchain and 32-bit dependencies
        run: |
          set -eux
          dpkg --add-architecture i386
          apt-get update
          # The amd64 libsdl2-dev and libgl-dev are not a mistake: native's
          # CMakeLists looks them up at the top level with REQUIRED (for the
          # 64-bit melee_prototype viewer, which this job never builds), so
          # configuring the product target fails without them.  libwayland-bin
          # is amd64 for a different reason: wayland-scanner runs on the build
          # machine, so it is the one Wayland piece that must not be :i386.
          apt-get install -y --no-install-recommends \
            git ca-certificates curl xz-utils \
            cmake ninja-build pkg-config gcc-multilib g++-multilib \
            libsdl2-dev libgl-dev libwayland-bin \
            libgl-dev:i386 libegl-dev:i386 libgles-dev:i386 \
            libwayland-dev:i386 libdecor-0-dev:i386 \
            libx11-dev:i386 libxext-dev:i386 libxcursor-dev:i386 \
            libxi-dev:i386 libxrandr-dev:i386 libxfixes-dev:i386 \
            libxss-dev:i386 libxtst-dev:i386 libxkbcommon-dev:i386 \
            libdrm-dev:i386 libasound2-dev:i386

      # One run should tell us everything that is missing, not the first thing:
      # SDL3 reports one missing X11/Wayland dependency per configure, so
      # discovering them from CI failures costs a run each.
      - name: Check what the SDL3 build actually needs
        run: |
          missing=""
          for h in GL/gl.h EGL/egl.h GLES3/gl3.h X11/Xlib.h \
                   X11/Xcursor/Xcursor.h X11/extensions/Xrandr.h \
                   X11/extensions/XTest.h wayland-client.h \
                   xkbcommon/xkbcommon.h libdecor-0/libdecor.h \
                   alsa/asoundlib.h; do
            [ -e "/usr/include/$h" ] || missing="$missing $h"
          done
          # Wayland is found purely through pkg-config, so it is the i386 .pc
          # files that decide whether the driver is built -- a header check
          # alone would pass and the driver would still be silently absent.
          for pc in wayland-client wayland-egl wayland-cursor egl xkbcommon \
                    libdecor-0 x11 xext xcursor xi xfixes xrandr xtst; do
            PKG_CONFIG_LIBDIR=/usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig \
              pkg-config --exists "$pc" || missing="$missing $pc.pc(i386)"
          done
          command -v wayland-scanner >/dev/null || missing="$missing wayland-scanner"
          if [ -n "$missing" ]; then
            echo "missing:$missing"
            exit 1
          fi
          echo "all required headers and 32-bit packages present"

      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Build 32-bit SDL3
        run: |
          set -eux
          curl -sL -o sdl.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL3-${SDL_VERSION}.tar.gz"
          tar xzf sdl.tar.gz
          # Wayland is the desktop the port is developed on, so it is built
          # natively rather than through XWayland -- but X11 stays on as the
          # fallback, because a release with Wayland alone cannot open a window
          # at all on an X11 session.  SDL picks at runtime and dlopens either,
          # so neither is a hard runtime dependency of the shipped binary.
          # PulseAudio stays off: ALSA is what a 32-bit game can rely on.
          #
          # -G Ninja, not the default: the container installs ninja-build and
          # no make at all, so "Unix Makefiles" has no build program and
          # configuring dies before it ever looks for a compiler.
          #
          # PKG_CONFIG_LIBDIR is what makes the 32-bit half work: SDL3 finds
          # Wayland only through pkg-config, and the container's pkg-config
          # searches the amd64 directory, where none of the :i386 dev packages
          # put a .pc file.  Scoped to this step -- the port's own configure
          # needs the amd64 pkg-config path back for melee_prototype's sdl2.
          #
          # Installed as /usr/lib32/libSDL3.so and /usr/include/SDL3, which is
          # the Arch lib32-sdl3 layout the port is written against: native's
          # CMakeLists finds the 32-bit SDL3 with NO_DEFAULT_PATH in /usr/lib32
          # and skips the whole `melee` target when it is anywhere else.
          PKG_CONFIG_LIBDIR=/usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig \
          cmake -S "SDL3-${SDL_VERSION}" -B sdlb -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 \
            -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib32 \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
            -DSDL_WAYLAND=ON -DSDL_X11=ON \
            -DSDL_ALSA=ON -DSDL_PULSEAUDIO=OFF -DSDL_PIPEWIRE=OFF
          # Fail loudly here rather than at the port's link step: SDL disables a
          # video driver whose dependencies are missing with a warning, not an
          # error, and the result is a binary that never opens a window.
          # SDL 3.4 generates this in a configuration-specific include tree.
          # (Older SDL releases used sdlb/include/build_config instead.)
          cfg=sdlb/include-config-release/build_config/SDL_build_config.h
          grep -q "SDL_VIDEO_DRIVER_WAYLAND 1" "$cfg" \
            || { echo "SDL3 configured without Wayland -- see the missing dependency above"; exit 1; }
          grep -q "SDL_VIDEO_DRIVER_X11 1" "$cfg" \
            || { echo "SDL3 configured without X11 -- the release would not run on an X11 session"; exit 1; }
          cmake --build sdlb -j"$(nproc)"
          cmake --install sdlb
          ldconfig

      - name: Build the port
        # Container jobs default to /bin/sh; this step needs Bash so the
        # configure pipeline preserves cmake's exit status through tee.
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S native -B build/native -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            2>&1 | tee configure.log
          # The melee target is conditional on 32-bit SDL3 being found, and a
          # skipped target is only a STATUS line -- say so here rather than
          # dying on a missing file two steps later.
          if grep -q "skipping the product melee target" configure.log; then
            echo "configure found no 32-bit SDL3 in /usr/lib32"
            exit 1
          fi
          cmake --build build/native -j"$(nproc)" --target melee

      - name: Name it for the release
        run: |
          mkdir -p out
          cp build/native/melee out/melee-linux-x86

      - uses: actions/upload-artifact@v4
        with: { name: port-linux, path: out/* }

  # The launcher is an ordinary 64-bit app and builds on its own platform:
  # Tauri cross-compilation is not worth the trouble.
  launcher:
    strategy:
      fail-fast: false
      matrix:
        include:
          # AppImage is asked for here rather than in tauri.conf.json: its
          # bundler downloads linuxdeploy from GitHub on first use, which is
          # reliable on a runner and is not on every developer machine -- it
          # times out on the maintainer's.  Keeping it out of the config means
          # a local `npx tauri build` always works and CI still ships both.
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: dtolnay/rust-toolchain@stable

      - name: Linux webview dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf

      - run: npm ci
        working-directory: launcher

      - run: npm run typecheck
        working-directory: launcher

      - run: npx tauri build --bundles ${{ matrix.bundles }}
        working-directory: launcher

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.os }}
          path: |
            launcher/src-tauri/target/release/bundle/deb/*.deb
            launcher/src-tauri/target/release/bundle/appimage/*.AppImage
            launcher/src-tauri/target/release/bundle/msi/*.msi
            launcher/src-tauri/target/release/bundle/nsis/*.exe

  publish:
    needs: [port-windows, port-linux, launcher]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: What is being published
        run: find dist -type f -printf "%f  %s bytes\n" | sort
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
